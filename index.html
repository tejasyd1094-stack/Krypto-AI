<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Krypto AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            listStyleType: {
              square: 'square',
            },
            colors: {
              royalGold: '#D4AF37',
              deepIndigo: '#0F172A',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #050505;
        --royal-gold: #D4AF37;
        --deep-gold: #AA8B24;
        --bright-gold: #FDE047;
        --indigo-deep: #0f172a;
        --indigo-accent: #2e3192;
        --glass-bg: rgba(12, 12, 14, 0.75);
        --glass-border: rgba(255, 255, 255, 0.08);
        --mesh-blur: 100px;
      }

      /* MOBILE OPTIMIZATION: Reduce blur radius to save VRAM on iOS/Mobile */
      @media (max-width: 768px) {
        :root {
          --mesh-blur: 40px;
        }
      }

      html, body {
        background-color: var(--bg-color);
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #f4f4f5;
        overflow-x: hidden;
      }

      /* THE OBSIDIAN MESH PROTOCOL - UNIVERSAL VIEWPORT OPTIMIZATION */
      .obsidian-mesh {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--bg-color);
        overflow: hidden;
        pointer-events: none;
        transform: translate3d(0,0,0); /* Hardware acceleration */
        transition: opacity 0.5s ease-in-out;
      }

      /* CRITICAL FIX: Hide the heavy mesh during simulation to prevent Safari process crashes */
      body.simulation-active .obsidian-mesh {
        display: none !important;
      }

      /* Vibrant Fluid Blobs - Positioned for Mobile Safe Zones */
      .mesh-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--mesh-blur));
        -webkit-filter: blur(var(--mesh-blur));
        opacity: 0.22;
        mix-blend-mode: screen;
        pointer-events: none;
        will-change: transform, opacity;
        transform: translate3d(0,0,0);
      }

      .blob-gold-primary {
        width: 140vmax;
        height: 140vmax;
        background: radial-gradient(circle, var(--royal-gold) 0%, transparent 65%);
        top: -40%;
        left: -30%;
        animation: silk-drift-1 45s infinite alternate ease-in-out;
      }

      .blob-indigo-primary {
        width: 150vmax;
        height: 150vmax;
        background: radial-gradient(circle, var(--indigo-accent) 0%, var(--indigo-deep) 35%, transparent 75%);
        bottom: -45%;
        right: -25%;
        opacity: 0.28;
        animation: silk-drift-2 55s infinite alternate ease-in-out;
      }

      .blob-accent-glow {
        width: 50vmax;
        height: 50vmax;
        background: radial-gradient(circle, var(--bright-gold) 0%, transparent 70%);
        top: 15%;
        right: 10%;
        opacity: 0.08;
        animation: silk-drift-3 30s infinite reverse ease-in-out;
      }

      @keyframes silk-drift-1 {
        0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
        100% { transform: translate3d(5%, 10%, 0) scale(1.1) rotate(5deg); }
      }

      @keyframes silk-drift-2 {
        0% { transform: translate3d(0, 0, 0) scale(1.15) rotate(0deg); }
        100% { transform: translate3d(-8%, -12%, 0) scale(1) rotate(-8deg); }
      }

      @keyframes silk-drift-3 {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); }
        100% { transform: translate3d(-10%, 5%, 0) rotate(360deg); }
      }

      /* NEURAL TOPOGRAPHY PATTERN - SCALED FOR ALL DEVICES */
      .neural-topography {
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='1000' height='400' viewBox='0 0 1000 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='white' stroke-width='0.8' opacity='0.25'%3E%3Cpath d='M0 20 Q 250 0 500 20 T 1000 20'/%3E%3Cpath d='M0 40 Q 250 20 500 40 T 1000 40'/%3E%3Cpath d='M0 60 Q 250 40 500 60 T 1000 60'/%3E%3Cpath d='M0 80 Q 250 60 500 80 T 1000 80'/%3E%3Cpath d='M0 100 Q 250 80 500 100 T 1000 100'/%3E%3Cpath d='M0 120 Q 250 100 500 120 T 1000 120'/%3E%3Cpath d='M0 140 Q 250 120 500 140 T 1000 140'/%3E%3Cpath d='M0 160 Q 250 140 500 160 T 1000 160'/%3E%3Cpath d='M0 180 Q 250 160 500 180 T 1000 180'/%3E%3Cpath d='M0 200 Q 250 180 500 200 T 1000 200'/%3E%3Cpath d='M0 220 Q 250 200 500 220 T 1000 220'/%3E%3Cpath d='M0 240 Q 250 220 500 240 T 1000 240'/%3E%3Cpath d='M0 260 Q 250 240 500 260 T 1000 260'/%3E%3Cpath d='M0 280 Q 250 260 500 280 T 1000 280'/%3E%3Cpath d='M0 300 Q 250 280 500 300 T 1000 300'/%3E%3Cpath d='M0 320 Q 250 300 500 320 T 1000 320'/%3E%3Cpath d='M0 340 Q 250 320 500 340 T 1000 340'/%3E%3Cpath d='M0 360 Q 250 340 500 360 T 1000 360'/%3E%3Cpath d='M0 380 Q 250 360 500 380 T 1000 380'/%3E%3Cpath d='M0 400 Q 250 380 500 400 T 1000 400'/%3E%3C/g%3E%3C/svg%3E");
        background-size: 100% auto;
        background-repeat: repeat;
        opacity: 0.55;
        mix-blend-mode: soft-light;
        animation: topography-drift 120s linear infinite;
        transform: translate3d(0,0,0);
        pointer-events: none;
      }

      @media (min-width: 1024px) {
        .neural-topography {
          background-size: 1200px 480px;
        }
      }

      @keyframes topography-drift {
        from { background-position: 0 0; }
        to { background-position: 1000px 400px; }
      }

      /* Premium tactile grain */
      .obsidian-mesh::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.06;
        filter: contrast(180%) brightness(1000%);
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .vignette-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, rgba(5, 5, 5, 0.8) 100%);
        pointer-events: none;
        z-index: -1;
      }

      /* Global Styles */
      .gold-text-gradient {
        background: linear-gradient(135deg, #fde047 0%, #eab308 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(234, 179, 8, 0.2);
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.25); border-radius: 10px; }

      /* Prose Overrides */
      .prose-krypto h1, .prose-krypto h2, .prose-krypto h3 {
        color: var(--royal-gold);
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .prose-krypto p { color: #d1d1d6; line-height: 1.7; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
        "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
        "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
        "mammoth": "https://esm.sh/mammoth@^1.8.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
        "@tailwindcss/typography": "https://esm.sh/@tailwindcss/typography@0.5.10"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="text-zinc-100 selection:bg-yellow-500/50">
    <!-- REFINED BACKGROUND ARCHITECTURE -->
    <div class="obsidian-mesh" aria-hidden="true">
      <div class="mesh-blob blob-gold-primary"></div>
      <div class="mesh-blob blob-indigo-primary"></div>
      <div class="mesh-blob blob-accent-glow"></div>
      <div class="neural-topography"></div>
      <div class="vignette-overlay"></div>
    </div>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krypto AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            listStyleType: {
              square: 'square',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #09090b;
      }
      .gold-glow {
        box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
      }
      .gold-text-gradient {
        background: linear-gradient(135deg, #fde047 0%, #eab308 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #eab308;
      }

      /* High-Performance Markdown Rendering */
      .prose-krypto h1, .prose-krypto h2, .prose-krypto h3 {
        color: #eab308;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .prose-krypto h3 { font-size: 1.1rem; }
      
      .prose-krypto p {
        margin-bottom: 1rem;
        line-height: 1.6;
        color: #d1d1d6;
        font-size: 0.9rem;
      }

      /* Modern Table Architecture */
      .prose-krypto .table-container {
        overflow-x: auto;
        margin: 1.5rem 0;
        border-radius: 16px;
        background: rgba(24, 24, 27, 0.4);
        border: 1px solid #27272a;
      }
      
      .prose-krypto table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
        text-align: left;
      }
      
      .prose-krypto th {
        background: #18181b;
        color: #fde047;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.75rem 1rem;
        border-bottom: 2px solid #27272a;
        font-size: 0.7rem;
      }
      
      .prose-krypto td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #18181b;
        color: #e4e4e7;
        font-weight: 500;
      }
      
      .prose-krypto tr:last-child td {
        border-bottom: none;
      }
      
      .prose-krypto tr:hover td {
        background: rgba(234, 179, 8, 0.04);
      }

      .prose-krypto strong {
        color: #fde047;
        font-weight: 700;
      }
      
      .prose-krypto ul {
        list-style-type: none;
        padding-left: 0;
        margin-bottom: 1.25rem;
      }
      
      .prose-krypto li {
        margin-bottom: 0.5rem;
        position: relative;
        padding-left: 1.25rem;
        color: #d1d1d6;
        font-size: 0.85rem;
      }
      
      .prose-krypto li::before {
        content: '→';
        position: absolute;
        left: 0;
        color: #eab308;
        font-weight: 900;
      }
      
      .prose-krypto blockquote {
        border-left: 3px solid #eab308;
        background: rgba(234, 179, 8, 0.03);
        padding: 0.75rem 1.25rem;
        margin: 1.25rem 0;
        border-radius: 0 10px 10px 0;
        font-style: italic;
        color: #a1a1aa;
        font-size: 0.85rem;
      }

      /* Paper Preview Custom Styles for Premium Resume */
      .prose-slate { 
        font-family: 'Inter', serif; 
        line-height: 1.7;
        color: #0f172a;
        text-align: left;
      }
      .prose-slate h1 { text-align: left; margin-bottom: 2.5rem !important; }
      .prose-slate h2 { margin-top: 4rem !important; margin-bottom: 2rem !important; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; }
      .prose-slate h3 { margin-top: 3rem !important; margin-bottom: 1.2rem !important; text-align: left; }
      .prose-slate p { margin-bottom: 2rem !important; text-align: left; }
      .prose-slate ul { margin-top: 1rem !important; margin-bottom: 3rem !important; text-align: left; }
      .prose-slate li { margin-bottom: 1rem !important; text-align: left; }
      .prose-slate hr { margin: 4rem 0 !important; border: 0; border-top: 1px solid #cbd5e1; }
      
      .prose-slate blockquote {
        border: none;
        background-color: transparent;
        padding: 0;
        margin: 0 0 4rem 0 !important;
        text-align: left;
        font-style: normal;
      }
      .prose-slate blockquote p {
        margin-top: 0;
        margin-bottom: 0 !important;
        font-weight: 700;
        color: #475569;
        text-align: left;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "mammoth": "https://esm.sh/mammoth@^1.8.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "@tailwindcss/typography": "https://esm.sh/@tailwindcss/typography@0.5.10"
  }
}
</script>
</head>
  <body class="text-zinc-100 selection:bg-yellow-500/30">
    <div id="root"></div>
  </body>
</html>
